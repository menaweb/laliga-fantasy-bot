name: fantasy-run
on:
  schedule:
    # Horarios pedidos por Rafa: 10:00 y 21:10 hora de Madrid. El cron es UTC (verano +2h, invierno +1h):
    - cron: "0 8 * * *"              # 10:00 Madrid (verano) / 09:00 (invierno)
    - cron: "10 19 * * *"            # 21:10 Madrid (verano) / 20:10 (invierno)
  repository_dispatch:
    types: [tick]                  # disparo externo (cron-job.org) cada 30 min; usa las variables del repo
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Forzar simulación (si es false, manda la variable DRY_RUN del repo)"
        type: boolean
        default: false

concurrency:
  group: fantasy-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || (vars.DRY_RUN || 'true') }}
      KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
      ENABLED_WRITES: ${{ vars.ENABLED_WRITES || '' }}
      LALIGA_TOKEN_FILE: /tmp/tokens.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: python main.py run --live
      - name: Commit state
        if: always()
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
